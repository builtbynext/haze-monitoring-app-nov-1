<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Singapore haze (NEA 24-hour PSI, PM2.5, PM10) and ASEAN city weather from Open-Meteo.">
<meta name="theme-color" content="#0E1012">
<style>html{background:#0E1012}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Haze Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
/* Layout: dark editorial page. Singapore view = haze card (map + reading panel, as in the reference),
   then Singapore weather. ASEAN view = weather map + city detail + city grid. */
:root{
  --font-body:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-serif:'Newsreader',Georgia,'Times New Roman',serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;

  --bg:#0E1012;
  --surface:#1C2023;
  --panel:#15181A;
  --panel-2:#1A1E21;
  --land:#23282C;
  --line:#2B3135;
  --ink:#E9EBEC;
  --ink-2:#BCC1C5;
  --ink-3:#8C9298;
  --accent:#E8A53C;
  --accent-soft:rgba(232,165,60,.14);

  --b1:#5DAF88;
  --b2:#E3B93C;
  --b3:#E36B52;
  --b4:#A97BD1;
  --b5:#D14D66;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);
  font:400 15px/1.5 var(--font-body);
  -webkit-font-smoothing:antialiased;
  padding-block:0 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:960px;margin-inline:auto}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
h1,h2,h3,p,dl,dd,ul{margin:0;padding:0}
ul{list-style:none}
.serif{font-family:var(--font-serif);font-feature-settings:"onum" 1;font-variant-numeric:oldstyle-nums}
h1{font:400 clamp(32px,5vw,42px)/1.1 var(--font-serif);letter-spacing:-.01em}
h2{font:400 28px/1.15 var(--font-serif);letter-spacing:-.01em;text-wrap:balance}
.eyebrow{font:400 11px/1.4 var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px 30px;padding-block:28px 6px}
.brand{display:flex;align-items:center;gap:10px;font:600 16px var(--font-body)}
.logo{color:var(--accent)}
.tabs{display:flex;gap:26px}
.tabs button{border:0;background:none;padding:8px 0;font:500 15px var(--font-body);color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent;border-radius:0}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tools{margin-left:auto;display:flex;align-items:center;gap:10px}
.icon-btn{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer}
.icon-btn:hover{color:var(--ink);border-color:var(--ink-3)}
.icon-btn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:720px){.tabs{order:2;flex-basis:100%}}

.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin:34px 0 24px}
.meta{margin-top:8px;color:var(--ink-2);font-size:14px}
.chip{font:400 10.5px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;padding:6px 11px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:8px;background:var(--ink-3)}
.chip.ok i{background:var(--b1)}
.chip.bad i{background:var(--b3)}

/* cards */
.stack{display:grid;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;min-width:0}
@media (max-width:560px){.card{padding:18px}}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px}
.s5{grid-column:span 5}.s7{grid-column:span 7}.s12{grid-column:span 12}
@media (max-width:860px){.s5,.s7{grid-column:span 12}}

/* haze card */
.haze h2{margin-top:8px}
.haze-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-top:18px}
@media (max-width:760px){.haze-grid{grid-template-columns:minmax(0,1fr)}}
.mapwrap{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow-x:auto;min-width:0}
.mapwrap svg{display:block;width:100%;min-width:440px;height:auto}
.side{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:18px 16px 16px;display:flex;flex-direction:column;min-width:0}
.side .eyebrow{font-size:10.5px;letter-spacing:.14em}
.pnum{display:flex;align-items:center;gap:14px;margin-top:22px}
.pnum .n{font:400 68px/1 var(--font-serif);font-feature-settings:"onum" 1;font-variant-numeric:oldstyle-nums;letter-spacing:-.02em}
.pnum .b{display:inline-flex;align-items:center;gap:8px;font:500 15px var(--font-body)}
.pnum .b i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.bar{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:6px}
.bar i{display:block;height:6px;border-radius:3px;background:var(--c);opacity:.28}
.bar i.on{opacity:1}
.ticks{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:10px;font:400 11px var(--font-mono);color:var(--ink-3);text-align:right}
.advice{margin-top:16px;color:var(--ink-2);font-size:15px;line-height:1.35}
.cells{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin-top:auto;padding-top:16px}
.cell{border-top:1px solid var(--line);padding-top:12px}
.cell dt{font:400 10.5px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.cell dd{margin-top:8px;font:400 15px var(--font-mono);color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:8px 26px;margin-top:20px;font-size:14px;color:var(--ink-2)}
.legend li{display:inline-flex;align-items:center;gap:9px}
.legend i{width:13px;height:13px;border-radius:3px;background:var(--c)}
.note{margin-top:14px;font-size:13px;line-height:1.5;color:var(--ink-3);max-width:76ch}

.reg{cursor:pointer;outline:none}
.reg .fill{transition:fill-opacity .15s}
.reg:hover .fill{fill-opacity:.46}
.reg:focus-visible .box{stroke-width:3}
.boxlbl{font:400 9px var(--font-mono);letter-spacing:.16em;fill:var(--ink-2)}
.boxval{font:400 30px var(--font-serif);font-feature-settings:"onum" 1;font-variant-numeric:oldstyle-nums;fill:var(--ink)}
.boxband{font:500 10.5px var(--font-body);fill:var(--ink)}
.water{font:400 10px var(--font-mono);letter-spacing:.2em;fill:var(--ink-3)}

.state{margin-top:18px;border:1px dashed var(--line);border-radius:8px;padding:28px 20px;display:grid;gap:10px;justify-items:start;background:var(--panel)}
.state b{font:600 15px var(--font-body)}
.state p{color:var(--ink-2);font-size:14px;max-width:62ch}
.state code{font:400 12px var(--font-mono);color:var(--ink-3);word-break:break-word}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:999px;font:500 13px var(--font-body);cursor:pointer}
.btn:hover{border-color:var(--ink-3)}

/* weather */
.ico{flex:none;color:var(--ink-2)}
.big .ico,.wx-main .ico{color:var(--accent)}
.wxgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:28px;margin-top:18px}
@media (max-width:760px){.wxgrid{grid-template-columns:minmax(0,1fr)}}
.wx-main{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.temp{font:400 64px/1 var(--font-serif);font-feature-settings:"onum" 1;font-variant-numeric:oldstyle-nums;letter-spacing:-.02em}
.cond{font:600 17px var(--font-body)}
.sub{margin-top:2px;color:var(--ink-2);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px;margin-top:22px}
.stat{border-top:1px solid var(--line);padding-top:12px}
.stat dt{font:400 10.5px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.stat dd{margin-top:8px;font:400 15px var(--font-mono)}
.stat dd small{color:var(--ink-3);font-size:12px}
.outlook{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:22px}
@media (max-width:560px){.outlook{grid-template-columns:repeat(2,minmax(0,1fr))}}
.oc{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px;justify-items:start}
.oc .hl{font:400 13px var(--font-mono)}
.oc .pr{font:400 11px var(--font-mono);color:var(--ink-3)}
.chart{width:100%;height:190px}
.chart svg{display:block;touch-action:pan-y}
.ax{font:11px var(--font-mono);fill:var(--ink-3)}
.endv{font:500 12px var(--font-mono);fill:var(--ink)}
.gt{font:500 12px var(--font-mono);fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:4;stroke-linejoin:round}

/* ASEAN */
.mapbox{margin-top:16px;border-radius:8px;overflow-x:auto;background:var(--panel);border:1px solid var(--line)}
.mapbox svg{display:block;width:100%;min-width:520px;height:auto}
.grat line{stroke:var(--line);stroke-width:1;stroke-dasharray:2 5}
.grat line.eq{stroke-dasharray:none}
.landname{font:500 10px var(--font-body);letter-spacing:.22em;fill:var(--ink-3);opacity:.7}
.axl{font:10px var(--font-mono);fill:var(--ink-3)}
.bub{cursor:pointer;outline:none}
.bub .main{fill:#2A3034;stroke:var(--line);stroke-width:1.5;transition:stroke .15s}
.bub:hover .main{stroke:var(--ink-3)}
.bub:focus-visible .main{stroke:var(--accent);stroke-width:3}
.bval{font:500 12px var(--font-mono);fill:var(--ink);pointer-events:none}
.bname{font:500 12px var(--font-body);fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:4;stroke-linejoin:round;pointer-events:none}
.detail{display:flex;flex-direction:column;gap:18px}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.dhead .sub{margin-top:6px}
.psi-chip{display:inline-flex;align-items:center;gap:8px;font:500 13px var(--font-body);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 10px;width:fit-content}
.psi-chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.sect{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.seg{display:inline-flex;padding:3px;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px}
.seg button{border:0;background:transparent;color:var(--ink-2);font:500 13px var(--font-body);padding:6px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.cities{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.ccard{appearance:none;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;align-content:start;min-width:0}
.ccard:hover{border-color:var(--ink-3)}
.ccard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ccard-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cname{font:600 15px var(--font-body)}
.ccountry{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.ctemp{font:400 34px/1 var(--font-serif);font-feature-settings:"onum" 1;font-variant-numeric:oldstyle-nums}
.ccard-mid{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}
.ccard-bot{font:400 11.5px var(--font-mono);color:var(--ink-3)}

.foot{margin-top:40px;color:var(--ink-3);font-size:12.5px;max-width:76ch}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font:500 13px var(--font-body);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div class="wrap">
  <header class="top">
    <div class="brand"><svg class="logo" width="26" height="26" aria-hidden="true"><use href="#i-haze"/></svg><span>Haze Watch</span></div>
    <nav class="tabs" aria-label="Coverage area">
      <button type="button" data-view="singapore">Singapore</button>
      <button type="button" data-view="asean">ASEAN weather</button>
    </nav>
    <div class="tools">
      <span class="chip" id="status"><i></i><span>Loading</span></span>
      <button type="button" class="icon-btn" id="refresh" aria-label="Reload live data" title="Reload live data"><svg width="18" height="18" aria-hidden="true"><use href="#i-refresh"/></svg></button>
    </div>
  </header>
  <main id="app"></main>
  <p class="foot">Haze readings (24-hour PSI, PM2.5, PM10) come from the National Environment Agency through data.gov.sg and cover Singapore only. Weather for every city comes from Open-Meteo. Nothing on this page is simulated: if a feed cannot be reached, the page says so.</p>
</div>

/* WMO weather codes used by Open-Meteo */
function wmo(c){
  if(c===0)return {t:'Clear',i:'sun'};
  if(c===1)return {t:'Mostly clear',i:'partly'};
  if(c===2)return {t:'Partly cloudy',i:'partly'};
  if(c===3)return {t:'Overcast',i:'cloud'};
  if(c===45||c===48)return {t:'Fog',i:'haze'};
  if(c>=51&&c<=57)return {t:'Drizzle',i:'rain'};
  if(c===61||c===80)return {t:'Light showers',i:'rain'};
  if(c===63||c===81)return {t:'Showers',i:'rain'};
  if(c===65||c===82||c===66||c===67)return {t:'Heavy rain',i:'rain'};
  if(c>=71&&c<=77||c===85||c===86)return {t:'Snow',i:'cloud'};
  if(c===95)return {t:'Thunderstorm',i:'storm'};
  if(c===96||c===99)return {t:'Thunderstorm, hail',i:'storm'};
  return {t:'Cloudy',i:'cloud'};
}
function compass(d){return ['N','NE','E','SE','S','SW','W','NW'][Math.round((d%360)/45)%8];}

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function bi(v){for(var i=0;i<BANDS.length;i++){if(v<=BANDS[i].max)return i;}return 4;}
function sgf(t,o){return new Intl.DateTimeFormat('en-GB',Object.assign({timeZone:'Asia/Singapore'},o)).format(new Date(t));}
function hm(iso){return sgf(iso,{hour:'2-digit',minute:'2-digit',hour12:false});}
function hourLabel(s){var h=+s.slice(11,13);return (h%12||12)+(h<12?' am':' pm');}
function ico(name,s){return '<svg class="ico" width="'+s+'" height="'+s+'" aria-hidden="true"><use href="#i-'+name+'"/></svg>';}
function getJSON(url){
  var ctl=new AbortController(),to=setTimeout(function(){ctl.abort();},12000);
  return fetch(url,{signal:ctl.signal}).then(function(res){
    if(!res.ok)throw new Error('HTTP '+res.status);
    return res.json();
  }).then(function(j){clearTimeout(to);return j;},function(e){clearTimeout(to);throw e;});
}
function errText(e){
  if(e&&e.name==='AbortError')return 'The request timed out.';
  if(e&&e.message&&/Failed to fetch|NetworkError|Load failed/i.test(e.message))return 'The browser could not complete the request. It was blocked or the network is offline.';
  return (e&&e.message)||'Unknown error.';
}

/* ---------- data: NEA via data.gov.sg ---------- */
function parseNEA(j){
  var items=j&&j.data&&j.data.items;
  if(!items||!items.length)throw new Error('The NEA response had no readings.');
  var it=items.slice().sort(function(a,b){return String(b.timestamp).localeCompare(String(a.timestamp));})[0];
  var rd=it.readings||{},psi=rd.psi_twenty_four_hourly,pm25=rd.pm25_twenty_four_hourly,pm10=rd.pm10_twenty_four_hourly;
  if(!psi)throw new Error('The NEA response had no 24-hour PSI field.');
  var regs={},any=false;
  REGIONS.forEach(function(r){
    var p=psi[r.id];
    if(typeof p!=='number'){regs[r.id]=null;return;}
    any=true;
    var main='—',best=-1;
    SUBS.forEach(function(s){var v=rd[s[0]]&&rd[s[0]][r.id];if(typeof v==='number'&&v>best){best=v;main=s[1];}});
    regs[r.id]={psi:p,band:bi(p),pm25:pm25&&typeof pm25[r.id]==='number'?pm25[r.id]:null,pm10:pm10&&typeof pm10[r.id]==='number'?pm10[r.id]:null,main:main};
  });
  if(!any)throw new Error('The NEA response had no regional PSI values.');
  return {regs:regs,national:typeof psi.national==='number'?psi.national:null,ts:it.timestamp,updated:it.updatedTimestamp||it.timestamp};
}
function loadNEA(){
  state.nea={s:'loading'};
  return getJSON(NEA_URL).then(parseNEA).then(function(d){state.nea={s:'ok',d:d};},function(e){state.nea={s:'error',m:errText(e)};});
}

/* ---------- data: Open-Meteo ---------- */
function loadWx(){
  state.wx={s:'loading'};
  var url='https://api.open-meteo.com/v1/forecast?latitude='+CITIES.map(function(c){return c.lat;}).join(',')+
    '&longitude='+CITIES.map(function(c){return c.lon;}).join(',')+
    '&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_direction_10m'+
    '&hourly=temperature_2m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,uv_index_max'+
    '&forecast_days=5&wind_speed_unit=kmh&timezone='+encodeURIComponent('Asia/Singapore');
  return getJSON(url).then(function(j){
    var arr=Array.isArray(j)?j:[j];
    if(arr.length!==CITIES.length)throw new Error('Open-Meteo returned '+arr.length+' locations, expected '+CITIES.length+'.');
    var out={};
    CITIES.forEach(function(c,i){
      var r=arr[i],cur=r.current,h=r.hourly,d=r.daily;
      if(!cur||!h||!d)throw new Error('Open-Meteo response is missing fields for '+c.name+'.');
      var start=h.time.indexOf(cur.time.slice(0,13)+':00');if(start<0)start=0;
      var times=h.time.slice(start,start+24),vals=h.temperature_2m.slice(start,start+24);
      out[c.id]={
        t:cur.temperature_2m,feels:cur.apparent_temperature,h:cur.relative_humidity_2m,w:cur.wind_speed_10m,d:compass(cur.wind_direction_10m),
        rain:cur.precipitation,cond:wmo(cur.weather_code),time:cur.time,
        hi:d.temperature_2m_max[0],lo:d.temperature_2m_min[0],uv:d.uv_index_max[0],rainDay:d.precipitation_sum[0],
        ser:{vals:vals,labels:times.map(hourLabel)},
        days:d.time.slice(1,5).map(function(day,k){return {day:day,cond:wmo(d.weather_code[k+1]),hi:d.temperature_2m_max[k+1],lo:d.temperature_2m_min[k+1],rain:d.precipitation_sum[k+1]};})
      };
    });
    state.wx={s:'ok',d:out};
  },function(e){state.wx={s:'error',m:errText(e)};});
}
function loadAll(){
  render();
  return Promise.all([loadNEA().then(render),loadWx().then(render)]);
}

/* ---------- chart (hourly temperature) ---------- */
function chartBox(id,ser){store.set(id,ser);return '<div class="chart" data-chart="'+id+'"></div>';}
function chartSVG(ser,k,W){
  var H=190,padL=40,padR=16,padT=22,padB=28,vals=ser.vals,n=vals.length;
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),step=(mx-mn)>10?5:2;
  var lo=Math.floor((mn-1)/step)*step,hi=Math.ceil((mx+1)/step)*step;
  var X=function(i){return padL+(W-padL-padR)*i/(n-1);},Y=function(v){return padT+(H-padT-padB)*(1-(v-lo)/(hi-lo));};
  var s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" data-w="'+W+'" data-h="'+H+'" data-l="'+padL+'" data-r="'+padR+'" data-t="'+padT+'" data-b="'+padB+'" data-lo="'+lo+'" data-hi="'+hi+'" role="img" aria-label="Temperature over the next 24 hours, from '+vals[0]+' to '+vals[n-1]+' degrees">';
  s+='<defs><linearGradient id="ga'+k+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.24"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>';
  for(var v=lo;v<=hi;v+=step){
    s+='<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" style="stroke:var(--line);stroke-width:1;stroke-dasharray:2 4"/>';
    s+='<text class="ax" x="'+(padL-8)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+v+'°</text>';
  }
  var line=vals.map(function(val,j){return (j?'L':'M')+X(j).toFixed(1)+' '+Y(val).toFixed(1);}).join(' ');
  s+='<path d="'+line+' L'+X(n-1).toFixed(1)+' '+Y(lo)+' L'+X(0).toFixed(1)+' '+Y(lo)+' Z" style="fill:url(#ga'+k+')"/>';
  s+='<path d="'+line+'" style="fill:none;stroke:var(--accent);stroke-width:2.25;stroke-linejoin:round;stroke-linecap:round"/>';
  [0,6,12,18,23].forEach(function(j){if(j<n)s+='<text class="ax" x="'+X(j)+'" y="'+(H-8)+'" text-anchor="middle">'+ser.labels[j]+'</text>';});
  s+='<circle cx="'+X(0)+'" cy="'+Y(vals[0])+'" r="5" style="fill:var(--accent);stroke:var(--surface);stroke-width:2.5"/>';
  s+='<text class="endv" x="'+(X(0)+10)+'" y="'+(Y(vals[0])-10)+'">now '+Math.round(vals[0])+'°</text>';
  s+='<g class="hov" style="display:none"><line class="gl" y1="'+padT+'" y2="'+Y(lo)+'" style="stroke:var(--ink-3);stroke-width:1"/><circle class="gd" r="4.5" style="fill:var(--surface);stroke:var(--accent);stroke-width:2.25"/><text class="gt"></text></g>';
  s+='<rect class="hit" x="'+padL+'" y="0" width="'+(W-padL-padR)+'" height="'+H+'" style="fill:transparent"/>';
  return s+'</svg>';
}
function wireChart(el,ser){
  var svg=el.querySelector('svg');if(!svg)return;
  var hov=svg.querySelector('.hov'),hit=svg.querySelector('.hit'),gl=svg.querySelector('.gl'),gd=svg.querySelector('.gd'),gt=svg.querySelector('.gt');
  var d=svg.dataset,W=+d.w,H=+d.h,padL=+d.l,padR=+d.r,padT=+d.t,padB=+d.b,lo=+d.lo,hi=+d.hi,n=ser.vals.length;
  function move(e){
    var r=svg.getBoundingClientRect(),px=(e.clientX-r.left)*(W/r.width);
    var i=Math.round((px-padL)/(W-padL-padR)*(n-1));i=Math.max(0,Math.min(n-1,i));
    var x=padL+(W-padL-padR)*i/(n-1),y=padT+(H-padT-padB)*(1-(ser.vals[i]-lo)/(hi-lo));
    gl.setAttribute('x1',x);gl.setAttribute('x2',x);gd.setAttribute('cx',x);gd.setAttribute('cy',y);
    var right=i>n*0.65;
    gt.setAttribute('x',right?x-10:x+10);gt.setAttribute('y',Math.max(y-10,padT+8));gt.setAttribute('text-anchor',right?'end':'start');
    gt.textContent=ser.labels[i]+' · '+Math.round(ser.vals[i])+'°';
    hov.style.display='';
  }
  hit.addEventListener('pointermove',move);hit.addEventListener('pointerdown',move);
  hit.addEventListener('pointerleave',function(){hov.style.display='none';});
}
function drawCharts(){
  document.querySelectorAll('.chart').forEach(function(el,k){
    var ser=store.get(el.dataset.chart);if(!ser||!ser.vals.length)return;
    el.innerHTML=chartSVG(ser,k,Math.max(260,el.clientWidth));wireChart(el,ser);
  });
}

  return '<div class="pagehead"><div><h1>Singapore</h1><p class="meta">'+sgf(Date.now(),{weekday:'long',day:'numeric',month:'long'})+'</p></div></div>'+
    '<div class="stack">'+hazeCard()+wxCard()+'</div>';
}

/* ---------- ASEAN weather ---------- */
function aseanMapSVG(sel){
  var X=function(lon){return (lon-93)*20;},Y=function(lat){return (23-lat)*20;},f=function(n){return n.toFixed(1);};
  function smooth(pts){
    var n=pts.length,mid=function(a,b){return [(a[0]+b[0])/2,(a[1]+b[1])/2];},m0=mid(pts[n-1],pts[0]);
    var d='M'+f(m0[0])+' '+f(m0[1]);
    for(var i=0;i<n;i++){var p=pts[i],m=mid(p,pts[(i+1)%n]);d+='Q'+f(p[0])+' '+f(p[1])+' '+f(m[0])+' '+f(m[1]);}
    return d+'Z';
  }
  var s='<svg viewBox="0 0 680 640" role="group" aria-label="Map of Southeast Asia with current temperature by city"><g class="grat">';
  for(var lon=95;lon<=125;lon+=5){s+='<line x1="'+X(lon)+'" y1="0" x2="'+X(lon)+'" y2="640"/>';}
  for(var lat=20;lat>=-5;lat-=5){s+='<line class="'+(lat===0?'eq':'')+'" x1="0" y1="'+Y(lat)+'" x2="680" y2="'+Y(lat)+'"/>';}
  s+='</g>';
  [[100,'100°E'],[110,'110°E'],[120,'120°E']].forEach(function(a){s+='<text class="axl" x="'+(X(a[0])+4)+'" y="632">'+a[1]+'</text>';});
  [[20,'20°N'],[10,'10°N'],[0,'0°'],[-5,'5°S']].forEach(function(a){s+='<text class="axl" x="6" y="'+(Y(a[0])-5)+'">'+a[1]+'</text>';});
  LAND.forEach(function(poly){s+='<path d="'+smooth(poly.map(function(p){return [X(p[0]),Y(p[1])];}))+'" style="fill:var(--land);stroke:var(--line);stroke-width:1;stroke-linejoin:round"/>';});
  LANDNAMES.forEach(function(l){s+='<text class="landname" x="'+X(l[0])+'" y="'+Y(l[1])+'" text-anchor="middle">'+l[2]+'</text>';});
  CITIES.forEach(function(c){
    var x=X(c.lon),y=Y(c.lat),r=17,tx,ty,an,w=state.wx.d[c.id];
    if(c.side==='l'){tx=x-r-7;ty=y+4;an='end';}else if(c.side==='b'){tx=x;ty=y+r+16;an='middle';}else{tx=x+r+7;ty=y+4;an='start';}
    s+='<g class="bub" data-city="'+c.id+'" role="button" tabindex="0" aria-label="'+c.name+', '+Math.round(w.t)+' degrees, '+w.cond.t+'">';
    if(c.id===sel)s+='<circle cx="'+f(x)+'" cy="'+f(y)+'" r="24" style="fill:none;stroke:var(--accent);stroke-width:2.5"/>';
    s+='<circle class="main" cx="'+f(x)+'" cy="'+f(y)+'" r="'+r+'"/><text class="bval" x="'+f(x)+'" y="'+f(y+4)+'" text-anchor="middle">'+Math.round(w.t)+'°</text>';
    s+='<text class="bname" x="'+f(tx)+'" y="'+f(ty)+'" text-anchor="'+an+'">'+c.name+'</text></g>';
  });
  return s+'</svg>';
}
function viewAsean(){
  var head='<div class="pagehead"><div><h1>ASEAN weather</h1><p class="meta">'+sgf(Date.now(),{weekday:'long',day:'numeric',month:'long'})+' · Times in SGT</p></div></div>';
  var w=state.wx;
  if(w.s!=='ok')return head+'<div class="stack"><section class="card"><div class="eyebrow">Twelve cities · Open-Meteo</div>'+stateBlock('Open-Meteo weather',w,'wx')+'</section></div>';
  var sel=CITIES.filter(function(c){return c.id===state.city;})[0],cw=w.d[sel.id];
  var psiChip='';
  if(sel.id==='singapore'&&state.nea.s==='ok'&&state.nea.d.national!==null){
    var b=bi(state.nea.d.national);
    psiChip='<span class="psi-chip" style="--c:var(--b'+(b+1)+')"><i></i>National 24-hr PSI '+state.nea.d.national+' · '+BANDS[b].name+' (NEA)</span>';
  }
  var map='<section class="card s7"><div class="eyebrow">Current temperature</div><h2 style="margin-top:8px">Southeast Asia</h2><div class="mapbox">'+aseanMapSVG(state.city)+'</div></section>';
  var detail='<section class="card s5 detail"><div class="eyebrow">Selected city</div>'+
    '<div class="dhead"><div><h2>'+sel.name+'</h2><p class="sub">'+sel.country+'</p></div></div>'+
    '<div class="wx-main">'+ico(cw.cond.i,48)+'<div class="temp">'+Math.round(cw.t)+'°</div><div><div class="cond">'+cw.cond.t+'</div><p class="sub">Feels like '+Math.round(cw.feels)+'° · High '+Math.round(cw.hi)+'° / Low '+Math.round(cw.lo)+'°</p></div></div>'+psiChip+
    '<div><div class="eyebrow" style="margin-bottom:8px">Next 24 hours · temperature</div>'+chartBox('c-'+sel.id,cw.ser)+'</div>'+
    '<dl class="stats" style="margin-top:0"><div class="stat"><dt>Humidity</dt><dd>'+Math.round(cw.h)+'<small> %</small></dd></div><div class="stat"><dt>Wind</dt><dd>'+Math.round(cw.w)+'<small> km/h '+cw.d+'</small></dd></div>'+
    '<div class="stat"><dt>Rain now</dt><dd>'+cw.rain.toFixed(1)+'<small> mm</small></dd></div><div class="stat"><dt>UV today</dt><dd>'+Math.round(cw.uv)+'<small> max</small></dd></div></dl></section>';
  var list=CITIES.slice().sort(function(a,b){return state.sort==='hot'?w.d[b.id].t-w.d[a.id].t:a.name.localeCompare(b.name);});
  var cards='<div class="cities s12" style="grid-column:span 12">'+list.map(function(c){
    var x=w.d[c.id];
    return '<button type="button" class="ccard" data-city="'+c.id+'" aria-pressed="'+(c.id===state.city)+'" aria-label="'+c.name+', '+Math.round(x.t)+' degrees, '+x.cond.t+'">'+
      '<div class="ccard-top"><div><div class="cname">'+c.name+'</div><div class="ccountry">'+c.country+'</div></div><span class="ctemp">'+Math.round(x.t)+'°</span></div>'+
      '<div class="ccard-mid">'+ico(x.cond.i,22)+'<span>'+x.cond.t+'</span></div>'+
      '<div class="ccard-bot">'+Math.round(x.h)+'% humidity · '+Math.round(x.w)+' km/h '+x.d+'</div></button>';
  }).join('')+'</div>';
  var sortSeg='<div class="seg" role="group" aria-label="Sort cities"><button type="button" data-sort="az" aria-pressed="'+(state.sort==='az')+'">A to Z</button><button type="button" data-sort="hot" aria-pressed="'+(state.sort==='hot')+'">Hottest</button></div>';
  return head+'<div class="grid">'+map+detail+'<div class="s12 sect"><h2>All cities</h2>'+sortSeg+'</div>'+cards+'</div>';
}

/* ---------- render + events ---------- */
function statusChip(){
  var el=document.getElementById('status'),n=state.nea.s,w=state.wx.s,cls='',txt;
  if(n==='loading'||w==='loading'){txt='Loading live data';}
  else if(n==='ok'&&w==='ok'){cls='ok';txt='Live · NEA + Open-Meteo';}
  else{cls='bad';txt=(n==='error'&&w==='error')?'Feeds unavailable':(n==='error'?'NEA unavailable':'Weather unavailable');}
  el.className='chip '+cls;el.lastChild.textContent=txt;
  document.getElementById('refresh').classList.toggle('spin',n==='loading'||w==='loading');
}
function render(focusSel){
  store.clear();
  document.querySelectorAll('.tabs button').forEach(function(b){b.setAttribute('aria-current',b.dataset.view===state.view?'page':'false');});
  app.innerHTML=state.view==='asean'?viewAsean():viewSingapore();
  statusChip();drawCharts();
  if(focusSel){var el=app.querySelector(focusSel);if(el)el.focus({preventScroll:true});}
}
var toastTimer;
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('on');},2200);}
document.addEventListener('keydown',function(e){
  usedKeyboard=true;
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('g[data-region],g[data-city]')){
    e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));
  }
});
document.addEventListener('pointerdown',function(){usedKeyboard=false;});
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-view],[data-region],[data-city],[data-sort],[data-retry],#refresh');
  if(!t)return;
  var focus=null;
  if(t.dataset.view){state.view=t.dataset.view;if(location.hash!=='#'+state.view){try{location.hash=state.view;}catch(err){}}}
  else if(t.dataset.region){state.region=t.dataset.region;if(usedKeyboard)focus='[data-region="'+t.dataset.region+'"]';}
  else if(t.dataset.city){state.city=t.dataset.city;if(usedKeyboard)focus='[data-city="'+t.dataset.city+'"]';}
  else if(t.dataset.sort){state.sort=t.dataset.sort;if(usedKeyboard)focus='[data-sort="'+t.dataset.sort+'"]';}
  else if(t.dataset.retry){if(t.dataset.retry==='nea')loadNEA().then(render);else loadWx().then(render);render();return;}
  else if(t.id==='refresh'){loadAll().then(function(){toast(state.nea.s==='ok'&&state.wx.s==='ok'?'Live data reloaded':'Some feeds could not be reached');});return;}
  render(focus);
});
window.addEventListener('hashchange',function(){
  var v=location.hash.slice(1);
  if((v==='singapore'||v==='asean')&&v!==state.view){state.view=v;render();}
});
var rz;
window.addEventListener('resize',function(){cancelAnimationFrame(rz);rz=requestAnimationFrame(drawCharts);});

var h0=location.hash.slice(1);
if(h0==='asean'||h0==='singapore')state.view=h0;
loadAll();
setInterval(function(){loadNEA().then(render);loadWx().then(render);},10*60*1000);
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(drawCharts);}
})();
</script>
